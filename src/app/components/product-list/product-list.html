<section class="product-list-section" *ngIf="produtos && produtos.length > 0">
  <h2 class="section-title" *ngIf="titulo">{{ titulo }}</h2>

  <div class="product-grid">
   <article class="product-card"
         *ngFor="let produto of produtos; let i = index; trackBy: trackByProdutoId"
         [class.hide-mobile]="maxMobile !== undefined && i >= maxMobile">

      <a [routerLink]="['/produtos', produto.id]" class="product-link-wrapper">
        <div class="product-image-wrapper">
          <img [src]="produto.urlImagem" [alt]="produto.nome" loading="lazy"
               (error)="$any($event.target).classList.add('img-error')">
        </div>

        <div class="product-content">
          <h3 class="product-name">{{ produto.nome }}</h3>
          <p class="product-price">{{ produto.preco | currency:'BRL' }}</p>
          <p class="product-shipping" *ngIf="produto.preco >= 50">
            <i class="bi bi-truck"></i> Entrega grátis em Bangu
          </p>
        </div>
      </a>

      <div class="product-footer">
        <button type="button" class="add-to-cart-button"
                [attr.aria-label]="'Adicionar ' + produto.nome + ' ao carrinho'"
                (click)="adicionarAoCarrinho(produto, $event)">
          <i class="bi bi-bag-plus"></i> Adicionar
        </button>
      </div>

    </article>
  </div>
</section>
