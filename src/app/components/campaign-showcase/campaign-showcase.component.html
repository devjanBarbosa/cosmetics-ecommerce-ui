<section class="campaign-showcase" *ngIf="!carregando && produtos.length > 0">
  <div class="container">
    
    <!-- Cabeçalho Dinâmico -->
    <header class="campaign-header">
      <div class="header-content">
        <span class="campaign-tag">{{ tagCampanha }}</span>
        <h2 class="title">{{ titulo }}</h2>
        <p class="subtitle">{{ subtitulo }}</p>
      </div>
      
      <a [routerLink]="linkVerTodos" [queryParams]="categoriaSlug ? { categoria: categoriaSlug } : null" class="see-all-link">
        Ver catálogo completo
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </header>

    <!-- Grid de Produtos da Campanha -->
    <div class="products-grid">
      <article class="commercial-card" *ngFor="let item of produtos">
        
        <!-- Mídia do Card com urlImagem real -->
        <div class="card-media">
          <span class="badge gift-badge">Pronto p/ Presente</span>
          <span class="badge stock-badge" *ngIf="item.estoque <= 3 && item.estoque > 0">Últimas {{ item.estoque }} un.</span>
          
          <img 
            [src]="item.urlImagem || 'assets/dia-do-professor.jpg'" 
            [alt]="item.nome"
            loading="lazy"
          />
        </div>

        <!-- Dados e Preço -->
        <div class="card-body">
          <span class="category-tag">{{ item.categoria?.nome }}</span>
          <h3 class="product-title" [title]="item.nome">{{ item.nome }}</h3>

          <div class="pricing-block">
            <div class="main-price">
              <span class="currency">R$</span>
              <span class="value">{{ item.preco | number:'1.2-2' }}</span>
            </div>
            <span class="payment-hint">no Pix ou Cartão</span>
          </div>

          <!-- Ação via WhatsApp -->
          <div class="card-actions">
            <button class="btn-whatsapp" (click)="comprarViaWhatsapp(item)" title="Pedir pelo WhatsApp">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.983.541 1.986.829 2.802.829 3.174 0 5.761-2.587 5.761-5.766 0-3.187-2.575-5.77-6.027-5.774l.26.754zm0-2.172c4.411 0 8 3.589 8 8 0 4.412-3.589 8-8 8-1.399 0-2.716-.363-3.861-1l-5.17 1.354 1.38-5.04c-.732-1.203-1.149-2.613-1.149-4.114 0-4.411 3.589-8 8-8z"/>
              </svg>
              <span>Garantir Kit</span>
            </button>
          </div>
        </div>

      </article>
    </div>

  </div>
</section>
