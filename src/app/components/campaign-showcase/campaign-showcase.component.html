<section class="campaign-showcase" *ngIf="!carregando && produtos.length > 0">
  <div class="container">

    <header class="campaign-header">
      <div class="header-content">
        <span class="campaign-tag">{{ tagCampanha }}</span>
        <h2 class="title">{{ titulo }}</h2>
        <p class="subtitle" *ngIf="subtitulo">{{ subtitulo }}</p>
      </div>

      <a [routerLink]="linkVerTodos" [queryParams]="{ categoria: categoriaId }" class="see-all-link">
        Ver todos os kits <i class="bi bi-arrow-right"></i>
      </a>
    </header>

    <app-product-list [produtos]="produtos" [titulo]="''"></app-product-list>

  </div>
</section>
