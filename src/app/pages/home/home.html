<div class="local-delivery-badge">
  <i class="bi bi-geo-alt-fill"></i>
  <span>Entrega expressa em <strong>Bangu e região</strong></span>
</div>

<section class="brand-pills-container">
  <div class="brand-pills-scroll">
    <button class="brand-pill">Natura</button>
    <button class="brand-pill">O Boticário</button>
    <button class="brand-pill">Avon</button>
    <button class="brand-pill">Eudora</button>
  </div>
</section>

<app-product-list [produtos]="produtosEmDestaque" titulo="Destaques da Semana"></app-product-list>

<app-welcome></app-welcome>

<section class="category-section">
  <div class="container">
    <h2 class="section-title">Categorias</h2>
    
    <div class="category-grid">
      
      <a *ngFor="let categoria of categoriasDeProduto" 
         [routerLink]="['/produtos']" 
         [queryParams]="{ categoria: categoria.id }" 
         class="category-card --grid-style">
        
        <div class="category-image-wrapper">
          <img *ngIf="categoria.urlImagem" [src]="categoria.urlImagem" [alt]="categoria.nome">
          <div *ngIf="!categoria.urlImagem" class="category-image-placeholder">
            <i class="bi bi-box-seam-fill"></i>
          </div>
        </div>
        
        <div class="category-name">
          <h3>{{ categoria.nome }}</h3>
        </div>
      </a>
      
    </div>
  </div>
</section>

<app-product-list [produtos]="produtosEmDestaque" titulo="Destaques da Semana"></app-product-list>

<app-reviews></app-reviews>
